name: tidi_assistant_flutter
description: "A new Flutter project."
organization: "ru.tidi.app"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  flutter_svg: ^2.0.9
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  logger: ^2.0.0
  file_picker: ^10.3.10
  flutter_markdown_plus: ^1.0.7
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.0

flutter:
  assets:
    - .env
    - assets/images/logo.svg
  uses-material-design: true

dependency_overrides:
  file_picker:
    git:
      url: https://hub.mos.ru/auroraos/flutter/flutter-community-plugins/file-picker.git
      ref: 5c062b38cbc6a830fd1580fc439b766d2f1e6795
