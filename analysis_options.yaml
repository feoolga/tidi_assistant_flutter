# analysis_options.yaml
# Конфигурация статического анализатора Dart.
# Запускается через `flutter analyze` или в IDE автоматически.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Скрипт для вывода структуры проекта. Использует print()
    # намеренно — это утилита, не часть приложения.
    - show_structure.dart

linter:
  rules:
    # --- Async / Futures ---
    # Запрещает "забытые" Future без await и без unawaited().
    unawaited_futures: true

    # --- Производительность ---
    # Требует const там, где это возможно. Меньше пересборок виджетов.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # --- Стиль и читаемость ---
    # Требует trailing comma в многострочных списках/параметрах.
    require_trailing_commas: true

    # --- Безопасность ---
    # Запрещает print() в коде приложения. Для логов есть AppLogger.
    avoid_print: true

    # --- Современный Dart ---
    prefer_final_fields: true

    # --- Отключено осознанно ---
    # Null-aware elements: синтаксис `'key': ?value` в map-литералах.
    # Доступен с Dart 3.8, но выигрыш нулевой, а читаемость хуже.
    # Включать, только если вся команда согласится.
    use_null_aware_elements: false
